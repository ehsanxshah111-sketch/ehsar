<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190">
  <style>
    .wordmark { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; }
    .slogan { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 600; }
  </style>

  <text x="320" y="90" class="wordmark" font-size="70" letter-spacing="14"
        fill="#111111" text-anchor="middle">EHSAR</text>

  <rect x="270" y="115" width="100" height="2" fill="#b08d57" />

  <text x="320" y="152" class="slogan" font-size="21" letter-spacing="2.5"
        fill="#b08d57" text-anchor="middle">STYLE FROM HEAD TO TOE</text>
</svg>
